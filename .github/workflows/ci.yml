name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  arch:
    name: arch-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Use the module's own Go version so `go install` of the guard is
          # guaranteed compatible. setup-go adds $(go env GOPATH)/bin to PATH.
          go-version-file: 'go.mod'
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.16.0
      - name: Check hexagonal boundaries
        run: go-arch-lint check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run tests
        run: make test
