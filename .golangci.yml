version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - goconst
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - depguard
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 15
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
    depguard:
      rules:
        domain-no-other-internal:
          files:
            - "**/internal/domain/**/*.go"
          deny:
            - pkg: "github.com/george/golinks/internal/ports"
              desc: "domain must not import ports"
            - pkg: "github.com/george/golinks/internal/app"
              desc: "domain must not import app layer"
            - pkg: "github.com/george/golinks/internal/adapters"
              desc: "domain must not import adapters"

        ports-no-impl:
          files:
            - "**/internal/ports/**/*.go"
          deny:
            - pkg: "github.com/george/golinks/internal/app"
              desc: "ports must not import app layer"
            - pkg: "github.com/george/golinks/internal/adapters"
              desc: "ports must not import adapters"

        app-no-adapters:
          files:
            - "**/internal/app/**/*.go"
          deny:
            - pkg: "github.com/george/golinks/internal/adapters"
              desc: "app layer must not import adapters directly"

        adapters-no-cross-import:
          files:
            - "**/internal/adapters/**/*.go"
          deny:
            - pkg: "github.com/george/golinks/internal/adapters/http"
              desc: "adapters must not import sibling adapters"
            - pkg: "github.com/george/golinks/internal/adapters/memory"
              desc: "adapters must not import sibling adapters"
            - pkg: "github.com/george/golinks/internal/adapters/postgres"
              desc: "adapters must not import sibling adapters"
            - pkg: "github.com/george/golinks/internal/adapters/sqlite"
              desc: "adapters must not import sibling adapters"

formatters:
  enable:
    - gofmt
    - goimports
